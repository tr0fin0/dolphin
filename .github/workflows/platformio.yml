name: PlatformIO

on:
    pull_request:
        branches: [ "main" ]
        paths:
          - 'components/**'
          - 'src/**'
          - 'platformio.ini'
          - 'sdkconfig.defaults'
        types:
          - opened
          - synchronize
    workflow_dispatch:

jobs:
    compilation-firmware:
        name: Verify Firmware Compilation
        permissions:
            contents: read
        runs-on: ubuntu-latest

        steps:
          - name: Checkout
            uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #v6.0.3

          - name: Cache Data
            uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae #v5.0.5
            with:
                path: |
                    ~/.cache/pip
                    ~/.platformio/.cache
                key: ${{ runner.os }}-pio

          - name: Setup Python
            uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 #v6.2.0
            with:
                python-version: '3.11'

          - name: PlatformIO Installation
            run: pip install --upgrade platformio

          - name: Verify Firmware Compilation
            run: pio run -e development
